plugins {
    id("java-library")
    id("checkstyle")
    id("eclipse")
    id("maven-publish")
    id("me.champeau.jmh") version "0.7.3"
    id("com.github.hierynomus.license") version "0.16.1"
    id("biz.aQute.bnd.builder") version "7.3.0"
    id("com.vanniktech.maven.publish") version "0.37.0"
    id("signing")
}

ext {
    reactiveStreamsVersion = "1.0.4"
    junitVersion = "4.13.2"
    testNgVersion = "7.12.0"
    mockitoVersion = "5.23.0"
    mockitoJUnitVersion = "5.23.0"
    jmhLibVersion = "1.37"
    guavaVersion = "33.6.0-jre"
    jupiterVersion = "6.1.1"
    jupiterLauncherVersion = "6.1.1"
    rxJavaVersion = "4.0.0-alpha-19"
}
group = "com.github.akarnokd" 
ext.githubProjectName = 'RxJavaExtensions'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

if (!hasProperty('mainClass')) {
    ext.mainClass = ''
}

repositories {
    mavenCentral()
    maven { url 'https://central.sonatype.com/repository/maven-snapshots' }
}

dependencies {
    implementation "io.reactivex.rxjava4:rxjava:$rxJavaVersion"

    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoJUnitVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:$jupiterVersion"

    // For Eclipse + JUnit Platform launcher (keep these)
    testImplementation "org.junit.platform:junit-platform-commons:$jupiterLauncherVersion"
    testImplementation "org.junit.platform:junit-platform-launcher:$jupiterLauncherVersion"
    testRuntimeOnly   "org.junit.platform:junit-platform-launcher:$jupiterLauncherVersion"

    // === NEW: Make requires static work for module-info.java compilation ===
    // These go on compileClasspath (so module-info.java can resolve them) but are NOT packaged
    compileOnly "org.junit.jupiter:junit-jupiter-api:$jupiterVersion"
    compileOnly "org.junit.platform:junit-platform-commons:$jupiterLauncherVersion"
    // Optional: if you also want the mockito requires static
    // compileOnly "org.mockito:mockito-core:$mockitoVersion"
}
// === Experimental JDK handling for Outreach Program ===
def experimental = System.getenv("JDK_EXPERIMENTAL")
def toolchainJdk = "26"   // default / baseline

if (experimental != null && !experimental.trim().isEmpty()) {
    toolchainJdk = experimental  // e.g. "27"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(toolchainJdk)
    }
    sourceCompatibility = JavaVersion.VERSION_26
    targetCompatibility = JavaVersion.VERSION_26
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
    options.compilerArgs += '-Xlint:-module'
    options.compilerArgs += '-Xlint:unchecked'
    modularity.inferModulePath = true
}

checkstyle {
    configFile = project.file("config/checkstyle/checkstyle.xml")
    configProperties = [
            "checkstyle.suppressions.file": project.file("config/checkstyle/suppressions.xml"),
            "checkstyle.header.file"      : project.file("config/license/HEADER_JAVA"),
            "project_loc"                 : project.projectDir.absolutePath
    ]
    checkstyleMain.exclude '**/module-info.java'
}

apply plugin: "com.vanniktech.maven.publish"

jmh {
    jmhVersion = '1.37'
    humanOutputFile = null
}

javadoc {
    source = sourceSets.main.allJava.matching {
        include 'io/reactivex/rxjava4/**'
        exclude '**/internal/**'
        exclude '**/test/**'
        exclude '**/perf/**'
        exclude '**/jmh/**'
        exclude 'module-info.java'
    }

    // Explicitly disable modularity inference (prevents Gradle adding module flags)
    modularity.inferModulePath = false

    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.output

    options {
        windowTitle = "RxJava Javadoc ${project.version}"
    }
    // Clear the following options to make the docs consistent with the old format
    options.addStringOption("top").value = ""
    options.addStringOption("doctitle").value = ""
    options.addStringOption("header").value = ""
    options.addBooleanOption('Xdoclint:none', true)   // disables all doclint checks (modern JDKs)

    failOnError = false

    options.links(
            "https://docs.oracle.com/en/java/javase/26/docs/api/",
            "https://reactivex.io/RxJava/4.x/javadoc/",
            "https://reactivex.io/RxJava/org.reactivestreams.javadoc/${reactiveStreamsVersion}/"
    )

    // modularity.inferModulePath = true  // let Gradle handle deps on --module-path
}

import aQute.bnd.gradle.Bundle   // ← important import

tasks.register('bundle', Bundle) {
    archiveBaseName.set('rxjava')           // or archiveFileName = "rxjava-${version}.jar"
    archiveVersion.set(project.version)
    archiveClassifier.set('')               // empty → no classifier

    from sourceSets.main.output             // your classes
    from('.') {
        include 'LICENSE'
        include 'COPYRIGHT'
        into 'META-INF/'
    }

    // Exclude module-info.class from root (you already had this)
    exclude 'module-info.class'

    // All your Bnd instructions go here
    bundle {
        bnd('-fixupmessages': '^Classes found in the wrong directory: \\{META-INF/versions/9/module-info\\.class=module-info\\}$')

        bnd('Bundle-Name': 'rxjava-extensions')
        bnd('Bundle-Vendor': 'David Karnok')
        bnd('Bundle-Description': 'RxJava 4.x extra sources, operators and components and ports of many older companion libraries.')
        bnd('Import-Package': '!org.junit,!junit.framework,!org.mockito.*,!org.testng.*,*')
        bnd('Bundle-DocURL': 'https://github.com/akarnokd/RxJavaExtensions')
        bnd('Eclipse-ExtensibleAPI': 'true')
        bnd('Export-Package': '!hu.akarnokd.rxjava4.internal.*,hu.akarnokd.rxjava4.*')
        bnd('Bundle-SymbolicName': 'hu.akarnokd.rxjava4')
        bnd('Multi-Release': 'true')
    }
}

def isCI = System.getenv("CI") != null
def testLoggingConfig = ["skipped", "failed"]
def parallelism = Runtime.runtime.availableProcessors()

if (!isCI) {
    testLoggingConfig = ["failed"]
    parallelism = parallelism.intdiv(2) ?: 1
}

test {
    maxHeapSize = "1200m"
    maxParallelForks = parallelism
    timeout = Duration.ofMinutes(30)

    useJUnitPlatform()
}

tasks.withType(Test) {
    testLogging {
        events = testLoggingConfig
        exceptionFormat = "full"

        debug.events = testLoggingConfig
        debug.exceptionFormat = "full"

        info.events = testLoggingConfig
        info.exceptionFormat = "full"

        warn.events = testLoggingConfig
        warn.exceptionFormat = "full"
    }
}

license {
    header rootProject.file('config/license/HEADER')
    ext.year = Calendar.getInstance().get(Calendar.YEAR)
    skipExistingHeaders true
    ignoreFailures true
    excludes(["**/*.md", "**/*.txt"])
}

apply plugin: "jacoco"

jacocoTestReport {
    dependsOn test

    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.required.set(true)
    }
}

check.dependsOn jacocoTestReport

checkstyle {
    configFile = project.file("config/checkstyle/checkstyle.xml")
    configProperties = [
            "checkstyle.suppressions.file": project.file("config/checkstyle/suppressions.xml"),
            "checkstyle.header.file"      : project.file("config/license/HEADER_JAVA"),
            "project_loc"                 : project.projectDir.absolutePath
    ]
    checkstyleMain.exclude '**/module-info.java'
}
